<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Favorite Games</title>
  <style>
    body {
      background-color: #000033;
      background-image:
        repeating-linear-gradient(
          0deg,
          transparent,
          transparent 2px,
          rgba(0,0,255,0.08) 2px,
          rgba(0,0,255,0.08) 4px
        );
      color: #568dd5 ;
      font-family: "Courier New", Courier, monospace;
      margin: 0;
      padding: 10px;
    }

    .marquee-bar {
      background: #000;
      border: 2px solid #568dd5 ;
      padding: 4px 0;
      margin-bottom: 10px;
      overflow: hidden;
      white-space: nowrap;
    }
    .marquee-inner {
      display: inline-block;
      animation: marquee 18s linear infinite;
      color: #568dd5 ;
      font-size: 0.85rem;
      letter-spacing: 0.1em;
    }
    @keyframes marquee {
      from { transform: translateX(100vw); }
      to   { transform: translateX(-100%); }
    }

    .container { max-width: 800px; margin: 0 auto; }

    .site-header {
      text-align: center;
      border: 3px double #aaaaaa ;
      background: #000;
      padding: 16px;
      margin-bottom: 12px;
    }
    .site-title {
      font-size: 2rem;
      text-shadow: 2px 2px -1px -1px #0000ff;
      letter-spacing: 0.05em;
      margin-bottom: 6px;
      animation: colorshift 3s infinite alternate;
    
    }
    .divider { text-align: center; color: #bbbbbb; font-size: 0.85rem; letter-spacing: 0.2em; margin: 10px 0; }

    .filter-section {
      background: #000;
      border: 2px solid #aaaaaa;
      padding: 8px 12px;
      margin-bottom: 12px;
      text-align: center;
    }
    .filter-section p { font-size: 0.75rem; color: #bbbbbb; margin-bottom: 6px; letter-spacing: 0.1em; }
    .filter-btn {
      font-family: "Courier New", monospace;
      font-size: 0.78rem;
      padding: 3px 10px;
      margin: 2px;
      background: #000080;
      color: #ffffff;
      border: 2px outset #aaaaaa;
      cursor: pointer;
      letter-spacing: 0.05em;
    }
    .filter-btn:active { border-style: inset; }
    .filter-btn.active { background: #000000; color: #bbbbbb; border: 2px inset #aaaaaa; }

    .game-count { font-size: 0.72rem; color: #aaaaaa; text-align: center; margin-bottom: 8px; }

    .game-list { display: flex; flex-direction: column; gap: 12px; }

    .game-card {
      background: #000;
      border: 2px solid #568dd5 ;
      display: flex;
      overflow: hidden;
    }
    .game-card:nth-child(even) { border-color: #568dd5 ; }
    .game-card:nth-child(3n)   { border-color: #568dd5  }

    .game-img-wrap {
      width: 140px;
      min-width: 140px;
      height: 140px;
      overflow: hidden;
      border-right: 2px solid #333;
      flex-shrink: 0;
      background: #111;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
    }
    .game-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      image-rendering: pixelated;
      filter: saturate(1.2) contrast(1.1);
    }

    .game-info { padding: 10px 14px; flex: 1; display: flex; flex-direction: column; gap: 5px; }
    .game-title { font-size: 1rem; color: #bbbbbb; letter-spacing: 0.05em; text-transform: uppercase; }
    .game-meta  { font-size: 0.72rem; color: #aaaaaa; letter-spacing: 0.08em; }
    .game-meta span { color: #00ffff; }
    .game-stars { font-size: 0.9rem; letter-spacing: 2px; color: #bbbbbb; }
    .game-stars .empty-star { color: #333; }
    .game-review { font-size: 0.78rem; color: #cccccc; line-height: 1.6; border-left: 2px solid #444; padding-left: 8px; margin-top: 2px; }

    .site-footer { text-align: center; margin-top: 16px; border-top: 2px dashed #333; padding-top: 10px; font-size: 0.7rem; color: #555; letter-spacing: 0.1em; }
  </style>
</head>
<body>
<div class="container">

  <div class="site-header">
    <div class="site-title"> Benny's Favorite Games</div>
  </div>

  <div class="filter-section">
    <p>&gt;&gt; FILTER BY GENRE &lt;&lt;</p>
   <div id="filter-bar"></div>
  </div>

  <div class="game-count" id="game-count"></div>
  <div class="game-list" id="game-list"></div>

</div>
<script>

const GAMES = [
  {
    title:  "Persona 4 Golden",
    genre:  "RPG",
    image:  "game_images/persona4.jpg",
    rating: 5,
    review: "An incredible detective story with compelling characters. While not the most modern gameplay, especially compared to later entries in the series, it stands on it's own as one of the best."
  },
  {
    title:  "Metroid Dread",
    genre:  "Metroidvania",
    image:  "game_images/metroid_dread.jpg",
    rating: 4,
    review: "The first Metroid game I beat. It was really fun, and a times even terrifying."
  },
  {
    title:  "Yakuza 0",
    genre:  "Beat-Em Up",
    image:  "game_images/yakuza0.jpg",
    rating: 5,
    review: "Pure adrenaline from start to finish. Very emotional as well. This game made me want to improve myself as a person to better help those around me. Masterpiece."
  },
  {
    title:  "Balatro",
    genre:  "Roguelike",
    image:  "game_images/balatro.jpg",
    rating: 4,
    review: "Unlike anything else. A genuine addiction that takes the form of an innocent card game."
  },
  {
    title:  "The Legend Of Zelda: Majora's Mask 3D",
    genre:  "Adventure",
    image:  "game_images/majora.jpg",
    rating: 4,
    review: "My favorite Zelda game. I've always loved the fact that you control time in this game, and how everything takes place in the span of 3 days. The moon is terryfing."
  },
  {
    title:  "Clair Obscure: Expedition 33",
    genre:  "RPG",
    image:  "game_images/exp33.jpg",
    rating: 5,
    review: "An absolute journey from start to finish. The story was impeccable, the voice acting performances were also exquisite (Ben Starr you were amazing!!). I played the game in it's hardest difficulty and wow, this was a challenge. A good one."
  }
];

// ---- No edits needed below this line ----

let currentFilter = 'All';

function starsHTML(rating) {
  let html = '';
  for (let i = 1; i <= 5; i++)
    html += `<span class="${i <= rating ? '' : 'empty-star'}">★</span>`;
  return html;
}

function buildFilters() {
  const genres = ['All', ...new Set(GAMES.map(g => g.genre))];
  document.getElementById('filter-bar').innerHTML = genres.map(genre =>
    `<button class="filter-btn ${genre === 'All' ? 'active' : ''}"
       onclick="setFilter('${genre}', this)">[${genre.toUpperCase()}]</button>`
  ).join('');
}

function setFilter(genre, btn) {
  currentFilter = genre;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderGames();
}

function renderGames() {
  const filtered = currentFilter === 'All' ? GAMES : GAMES.filter(g => g.genre === currentFilter);
  document.getElementById('game-count').textContent =
    `>> showing ${filtered.length} of ${GAMES.length} games <<`;
  document.getElementById('game-list').innerHTML = filtered.map(g => `
    <div class="game-card">
      <div class="game-img-wrap">
        ${g.image
          ? `<img src="${g.image}" alt="${g.title}" onerror="this.parentElement.innerHTML='🎮'"/>`
          : '🎮'}
      </div>
      <div class="game-info">
        <div class="game-title">${g.title}</div>
        <div class="game-meta">GENRE: <span>${g.genre}</span></div>
        <div class="game-stars">${starsHTML(g.rating)}</div>
        <div class="game-review">"${g.review}"</div>
      </div>
    </div>
  `).join('');
}

buildFilters();
renderGames();
</script>
</body>
</html>
