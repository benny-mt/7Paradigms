<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>~*~ My Music Hub ~*~</title>
  <style>
    body {
      background-color: #000000;
      color: #b4ccec;
      font-family: "Courier New", Courier, monospace;
      margin: 0;
      padding: 10px;
    }

    .marquee-bar {
      background: #000080;
      border: 2px solid #ff00ff;
      padding: 4px 0;
      margin-bottom: 10px;
      overflow: hidden;
      white-space: nowrap;
    }
    .marquee-inner {
      display: inline-block;
      animation: marquee 20s linear infinite;
      color: #ffffff;
      font-size: 0.85rem;
      letter-spacing: 0.1em;
    }
    @keyframes marquee {
      from { transform: translateX(100vw); }
      to   { transform: translateX(-100%); }
    }

    .container { max-width: 700px; margin: 0 auto; }

    .site-header {
      text-align: center;
      border: 3px double #568dd5;
      background: #000033;
      padding: 16px;
      margin-bottom: 14px;
    }
    .site-title {
      font-size: 1.9rem;
      letter-spacing: 0.06em;
      margin-bottom: 6px;
      animation: colorshift 4s infinite alternate;
    }
 
    .site-subtitle { font-size: 0.78rem; color: #aaaaaa; letter-spacing: 0.14em; }
    .blinking { animation: blink 1s step-end infinite; }
    @keyframes blink { 50% { opacity: 0; } }

    .divider { text-align: center; color: #ff00ff; font-size: 0.85rem; letter-spacing: 0.2em; margin: 12px 0; }

    /* Genre tags */
    .genres-box {
      border: 2px solid #568dd5;
      background: #000011;
      padding: 12px 16px;
      margin-bottom: 14px;
    }
    .genres-box p { font-size: 0.75rem; color: #568dd5; letter-spacing: 0.1em; margin-bottom: 8px; }
    .genre-tags { display: flex; flex-wrap: wrap; gap: 6px; }
    .genre-tag {
      font-size: 0.72rem;
      color: #00ffff;
      border: 1px solid #00ffff;
      padding: 2px 8px;
      cursor: pointer;
      letter-spacing: 0.06em;
      transition: background 0.1s;
    }
    .genre-tag:hover { background: #00ffff; color: #000; }

    /* Search */
    .search-box {
      border: 2px solid #568dd5;
      background: #000011;
      padding: 14px 16px;
      margin-bottom: 14px;
    }
    .search-box label { display: block; font-size: 0.78rem; color: #568dd5; letter-spacing: 0.12em; margin-bottom: 8px; }
    .input-row { display: flex; gap: 8px; }
    .search-box input {
      flex: 1;
      font-family: "Courier New", monospace;
      font-size: 0.9rem;
      padding: 6px 10px;
      background: #000;
      border: 2px inset #555;
      color: #b4ccec;
      outline: none;
      letter-spacing: 0.08em;
    }
    .search-box input:focus { border-color: #b4ccec; }
    .search-box button {
      font-family: "Courier New", monospace;
      font-size: 0.82rem;
      padding: 6px 14px;
      background: #000080;
      color: #ffffff;
      border: 2px outset #aaaaaa;
      cursor: pointer;
      letter-spacing: 0.06em;
    }
    .search-box button:active { border-style: inset; }

    /* Result */
    .result-box {
      border: 2px solid #568dd5;
      background: #000022;
      padding: 14px 16px;
      margin-bottom: 14px;
      display: none;
    }
    .result-box.visible { display: block; }

    .result-header {
      font-size: 0.7rem;
      color: #888;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      margin-bottom: 12px;
      border-bottom: 1px solid #568dd5;
      padding-bottom: 6px;
    }

    /* Card layout: image left, info right */
    .result-card {
      display: flex;
      gap: 16px;
      align-items: flex-start;
    }

    .result-cover {
      width: 120px;
      min-width: 120px;
      height: 120px;
      border: 2px solid #333;
      background: #111;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
      flex-shrink: 0;
      overflow: hidden;
    }
    .result-cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      image-rendering: pixelated;
    }

    .result-info { flex: 1; display: flex; flex-direction: column; gap: 5px; }

    .result-genre {
      font-size: 0.68rem;
      color: #ff00ff;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }
    .result-artist {
      font-size: 1.2rem;
      color: #b4ccec;
      letter-spacing: 0.03em;
    }
    .result-song {
      font-size: 0.85rem;
      color: #00ffff;
      letter-spacing: 0.05em;
    }
    .result-song span { color: #555; font-size: 0.72rem; }
    .result-note {
      font-size: 0.76rem;
      color: #bbbbbb;
      line-height: 1.6;
      border-left: 2px solid #333;
      padding-left: 8px;
      font-style: italic;
      margin-top: 4px;
    }

    /* Not found */
    .not-found {
      border: 2px solid #ff0000;
      background: #110000;
      padding: 14px 16px;
      margin-bottom: 14px;
      display: none;
      font-size: 0.82rem;
      color: #ff4444;
      letter-spacing: 0.08em;
    }
    .not-found.visible { display: block; }

    /* Full table */
    .all-box {
      border: 2px solid #568dd5;
      background: #000011;
      padding: 12px 16px;
      margin-bottom: 14px;
    }
    .all-box p { font-size: 0.72rem; color: #555; letter-spacing: 0.14em; margin-bottom: 10px; text-transform: uppercase; }
    table { width: 100%; border-collapse: collapse; font-size: 0.75rem; }
    th { text-align: left; color: #555; letter-spacing: 0.12em; text-transform: uppercase; border-bottom: 1px solid #222; padding: 4px 8px; font-weight: normal; }
    td { padding: 5px 8px; border-bottom: 1px solid #111; color: #999; vertical-align: middle; }
    td:first-child { color: #ff00ff; }
    td:nth-child(2) { color: #b4ccec; }
    td:nth-child(3) { color: #204a80; }
    td.cover-cell { width: 36px; padding: 3px 8px; }
    .thumb {
      width: 30px;
      height: 30px;
      object-fit: cover;
      border: 1px solid #333;
      display: block;
      image-rendering: pixelated;
    }
    .thumb-placeholder { font-size: 1.1rem; line-height: 30px; text-align: center; width: 30px; }
    tr:hover td { background: #0a0a1a; }

    .site-footer {
      text-align: center;
      margin-top: 16px;
      border-top: 2px dashed #222;
      padding-top: 10px;
      font-size: 0.7rem;
      color: #444;
      letter-spacing: 0.1em;
    }
  </style>
</head>
<body>
<div class="container">

  <div class="site-header">
    <div class="site-title">Benny's Music Hub </div>
  </div>



  <div class="genres-box">
    <p>&gt;&gt;GENRES (click to search) &lt;&lt;</p>
    <div class="genre-tags" id="genre-tags"></div>
  </div>

  <div class="search-box">
    <label>&gt; ENTER GENRE:</label>
    <div class="input-row">
      <input id="genre-input" type="text" placeholder="e.g. metal, jazz, rap..." autocomplete="off" spellcheck="false"/>
      <button onclick="search()">[ SEARCH ]</button>
    </div>
  </div>

  <!-- Result -->
  <div class="result-box" id="result-box">
    <div class="result-header">// SEARCH RESULT</div>
    <div class="result-card">
      <div class="result-cover" id="r-cover">♪</div>
      <div class="result-info">
        <div class="result-genre"  id="r-genre"></div>
        <div class="result-artist" id="r-artist"></div>
        <div class="result-song"   id="r-song"></div>
        <div class="result-note"   id="r-note"></div>
      </div>
    </div>
  </div>

  <!-- Not found -->
  <div class="not-found" id="not-found">
    &gt;&gt; ERROR 404: Genre not found in database.<br/>
    Try one of the genres listed above.
  </div>

  <!-- Full list -->
  <div class="all-box">
    <table>
      <thead>
        <tr>
          <th></th>
          <th>Genre</th>
          <th>Artist</th>
          <th>Fav Song</th>
        </tr>
      </thead>
      <tbody id="full-table"></tbody>
    </table>
  </div>

  </div>

</div>

<script>
// ============================================================
// Music Hub — to add or edit entries, modify the MUSIC object.
//
// Each key is a genre (lowercase). Fields:
//   artist  — your favorite artist in that genre
//   song    — your favorite song
//   note    — short personal comment (optional)
//   image   — filename inside an images/ subfolder (optional)
//             e.g. "images/master_of_puppets.jpg"
//             leave as "" to show the ♪ placeholder
// ============================================================
const MUSIC = {
  "rock": {
    artist: "Blur",
    song:   "Song 2",
    note:   "This song just makes me feel like the coolest dude ever.",
    image:  "images/metal.jpg"
  },
  "jazz": {
    artist: "Peggy Lee",
    song:   "Johnny Guitar",
    note:   "One of the highlights from the Fallout New Vegas radio. I never skipped this nor Big Iron.",
    image:  "images/jazz.jpg"
  },
  "rap": {
    artist: "Kill Bill: The Rapper",
    song:   "Chinatown",
    note:   "One of my favorite songs EVER. I love the romantic aspect to it, and the chill vibe of it. I gotta go back to Chinatown.",
    image:  "images/rap.jpg"
  },
  "hip hop": {
    artist: "Jurassic 5",
    song:   "What's Golden",
    note:   "One of my favorite hip hop tracks. It just encompasses what I love about the genre, good talk with solid delivery, with a beat that is to die for.",
    image:  "images/hiphop.jpg"
  },
  "indie": {
    artist: "Japanese Breakfast",
    song:   "Be Sweet",
    note:   "I can hit the high note when she says belieeeeeeeeve!",
    image:  "images/indie.jpg"
  },
  "electronic": {
    artist: "Daft Punk",
    song:   "Face to Face",
    note:   "Daft Punk's whole Discovery album is a genuine classic. The record has so many incredible tracks that its really hard to pick a specific one to highlight. Face to Face is one of my personal favs from this album, it's a vibe.",
    image:  "images/electronic.jpg"
  },

  "lo-fi rap": {
    artist: "Rav",
    song:   "down.exe",
    note:   "The sample to this song is a melody i've heard in a multitude of songs. That melody always calms me down, and this song just envelops that warm calm feeling even more.",
    image:  "images/punk.jpg"
  },
  "punk": {
    artist: "45ACIDBABIES",
    song:   "Jetlag Jenny",
    note:   "I like the vibe of this song, I also like the concept of it. And Jenny sounds like Benny!",
    image:  "images/reggae.jpg"
  }
};

// ---- No edits needed below this line ----

function normalize(str) { return str.trim().toLowerCase(); }

function coverHTML(image, fallback) {
  if (image) {
    return `<img src="${image}" alt="cover" onerror="this.parentElement.innerHTML='♪'"/>`;
  }
  return '♪';
}

function search() {
  const input  = document.getElementById('genre-input').value;
  const key    = normalize(input);
  const result = MUSIC[key];

  document.getElementById('result-box').classList.remove('visible');
  document.getElementById('not-found').classList.remove('visible');

  if (!input) return;

  if (result) {
    document.getElementById('r-cover').innerHTML  = coverHTML(result.image);
    document.getElementById('r-genre').textContent  = '[ ' + key.toUpperCase() + ' ]';
    document.getElementById('r-artist').textContent = result.artist;
    document.getElementById('r-song').innerHTML     = '♪ ' + result.song + ' <span>// favorite song</span>';
    document.getElementById('r-note').textContent   = result.note || '';
    document.getElementById('result-box').classList.add('visible');
  } else {
    document.getElementById('not-found').classList.add('visible');
  }
}

function buildGenreTags() {
  const container = document.getElementById('genre-tags');
  Object.keys(MUSIC).forEach(genre => {
    const tag = document.createElement('span');
    tag.className = 'genre-tag';
    tag.textContent = genre;
    tag.onclick = () => {
      document.getElementById('genre-input').value = genre;
      search();
    };
    container.appendChild(tag);
  });
}

function buildTable() {
  const tbody = document.getElementById('full-table');
  tbody.innerHTML = Object.entries(MUSIC).map(([genre, data]) => `
    <tr>
      <td class="cover-cell">
        ${data.image
          ? `<img class="thumb" src="${data.image}" alt="" onerror="this.outerHTML='<span class=thumb-placeholder>♪</span>'"/>`
          : '<span class="thumb-placeholder">♪</span>'}
      </td>
      <td>${genre}</td>
      <td>${data.artist}</td>
      <td>${data.song}</td>
    </tr>
  `).join('');
}

document.getElementById('genre-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') search();
});

buildGenreTags();
buildTable();
</script>
</body>
</html>
